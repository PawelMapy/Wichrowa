<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Mapa Kitkacy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map { width:100%; height:100%; }

/* UI ELEMENTS */
.ui-box {
    background: #ffffff;
    padding: 10px;
    border-radius: 6px;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
    z-index: 1000;
    font-family: sans-serif;
}

/* DARK MODE */
.dark-mode .ui-box {
    background: #222;
    color: #eee;
    border: 1px solid #555;
}

/* POPUP STYLE */
.leaflet-popup-content-wrapper {
    border: 1px solid #cccccc;
    border-radius: 6px;
    padding: 0;
}
.leaflet-popup-content {
    margin: 0;
    padding: 10px 14px;
    font-family: sans-serif;
}
.popup-title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 8px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
}
.popup-line {
    margin: 3px 0;
}

/* UI POSITIONS — RIGHT SIDE */
#darkToggle {
    position: absolute;
    top: 10px;
    right: 10px;
}

#layerControl {
    position: absolute;
    top: 70px;
    right: 10px;
    width: 220px;
}

#opacityControl {
    position: absolute;
    top: 260px;
    right: 10px;
    width: 220px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="darkToggle" class="ui-box">
    <label><input type="checkbox" id="darkSwitch"> Tryb nocny</label>
</div>

<div id="layerControl" class="ui-box">
    <div id="layerContainer"></div>
</div>

<div id="opacityControl" class="ui-box">
    <label>Przezroczystość warstw:</label><br>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
</div>

<script>

/* 1. INICJALIZACJA MAPY */
var map = L.map('map', { 
    minZoom: 12, 
    maxZoom: 22
}).setView([51.3375, 19.3642], 18);

/* 2. GEOPORTAL WMTS — ORTOFOTOMAPA (BASELAYER) */
var orto = L.tileLayer(
    "https://mapy.geoportal.gov.pl/wss/service/WMTS/guest/wmts?" +
    "SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0" +
    "&LAYER=ORTOFOTOMAPA&STYLE=default" +
    "&TILEMATRIXSET=EPSG:3857" +
    "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}" +
    "&FORMAT=image/jpeg",
    {
        maxZoom: 22,
        maxNativeZoom: 19,
        attribution: "© Geoportal.gov.pl",
        errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
    }
).addTo(map);

/* 3. TWOJE RASTROWE WARSTWY */
var opcjeWarstwy = {
    maxZoom: 22,
    maxNativeZoom: 20,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
};

var rosliny = L.tileLayer('./podklady/rosliny/{z}/{x}/{y}.jpg', opcjeWarstwy);
var cienie  = L.tileLayer('./podklady/cienie/{z}/{x}/{y}.jpg', opcjeWarstwy);
var ukszt   = L.tileLayer('./podklady/uksztaltowanie/{z}/{x}/{y}.jpg', opcjeWarstwy);

/* 4. DZIAŁKI — WARSTWA WEKTOROWA (PRZEŁĄCZANA) */
var dzialkiLayer = L.geoJSON(null, {
    style: { color: "#ff0000", weight: 2, fillOpacity: 0.1 },
    onEachFeature: function (feature, layer) {

        layer.on("mouseover", function() {
            layer.setStyle({ color: "#ffffff", weight: 3, fillOpacity: 0 });
        });
        layer.on("mouseout", function() {
            layer.setStyle({ color: "#ff0000", weight: 2, fillOpacity: 0.1 });
        });

        layer.on("click", function() {
            var p = feature.properties;
            var html = `
                <div class="popup-title">Informacje o działce ${p.numer || p.id || ""}</div>
                <div class="popup-line"><b>ID:</b> ${p.id || ""}</div>
                <div class="popup-line"><b>Gmina:</b> ${p.gmina || ""}</div>
                <div class="popup-line"><b>Obręb:</b> ${p.obreb || ""}</div>
                <div class="popup-line"><b>Powierzchnia:</b> ${p.powierzchnia || ""} m²</div>
                <div class="popup-line"><b>Klasoużytki:</b> ${p.klasouzytki || ""}</div>
                <div class="popup-line"><b>Data zdjęcia:</b> ${p.data || ""}</div>
            `;
            layer.bindPopup(html).openPopup();
        });
    }
});

/* ŁADOWANIE GEOJSON — NIE DODAJEMY AUTOMATYCZNIE DO MAPY */
fetch('./dzialki/dzialki.geojson')
    .then(r => r.json())
    .then(j => dzialkiLayer.addData(j))
    .catch(err => console.error("Błąd ładowania GeoJSON:", err));

/* 5. PANEL WARSTW */
var baseLayers = {
    "Ortofotomapa Geoportal": orto
};

var overlays = {
    "Stan roślin (VARI)": rosliny,
    "Cienie": cienie,
    "Ukształtowanie terenu": ukszt,
    "Działki": dzialkiLayer
};

var layerControl = L.control.layers(baseLayers, overlays, { collapsed: false }).addTo(map);

/* PRZENIESIENIE PANELU WARSTW DO TWOJEGO KONTENERA */
const lc = layerControl.getContainer();
document.getElementById("layerContainer").appendChild(lc);

/* 6. SUWAK PRZEZROCZYSTOŚCI */
document.getElementById("opacitySlider").addEventListener("input", function(e) {
    var v = e.target.value;
    [rosliny, cienie, ukszt].forEach(layer => {
        if (layer && typeof layer.setOpacity === "function") layer.setOpacity(v);
    });
});

/* 7. TRYB NOCNY */
document.getElementById("darkSwitch").addEventListener("change", function(e) {
    if (e.target.checked) {
        document.body.classList.add("dark-mode");
    } else {
        document.body.classList.remove("dark-mode");
    }
});

</script>
</body>
</html>
