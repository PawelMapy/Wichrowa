<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Mapa Kitkacy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com"/>
<script src="https://unpkg.com"></script>

<link rel="stylesheet" href="https://cloudflare.com"/>
<script src="https://cloudflare.com"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map { width:100%; height:100%; }

/* UI ELEMENTS */
.ui-box {
    background: #ffffff;
    padding: 10px;
    border-radius: 6px;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
    z-index: 1000;
    font-family: sans-serif;
}

/* DARK MODE */
.dark-mode .ui-box {
    background: #222;
    color: #eee;
    border: 1px solid #555;
}

/* LEGEND DEM */
#legendDEM {
    position: absolute;
    bottom: 20px;
    right: 10px;
    width: 140px;
}
.legend-step {
    height: 20px;
    margin-bottom: 4px;
    border: 1px solid #999;
    font-size: 12px;
    padding-left: 4px;
    color: #000;
}

/* UI POSITIONS — RIGHT SIDE */
#darkToggle {
    position: absolute;
    top: 10px;
    right: 10px;
}

#layerControl {
    position: absolute;
    top: 70px;
    right: 10px;
    width: 220px;
}

#opacityControl {
    position: absolute;
    top: 260px;
    right: 10px;
    width: 220px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="darkToggle" class="ui-box">
    <label><input type="checkbox" id="darkSwitch"> Tryb nocny</label>
</div>

<div id="layerControl" class="ui-box">
    <div id="layerContainer"></div>
</div>

<div id="opacityControl" class="ui-box">
    <label>Przezroczystość warstw:</label><br>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
</div>

<div id="legendDEM" class="ui-box">
    <b>Wysokość (m)</b><br><br>

    <div class="legend-step" style="background:#f7f08a">142.7</div>
    <div class="legend-step" style="background:#e5dd5c">138</div>
    <div class="legend-step" style="background:#c7bb51">134</div>
    <div class="legend-step" style="background:#a89a47">130</div>
    <div class="legend-step" style="background:#8a7a3d">126</div>
    <div class="legend-step" style="background:#6a5b33">122</div>
    <div class="legend-step" style="background:#4a3f2a">118</div>
    <div class="legend-step" style="background:#2e2a1f">116.7</div>
</div>

<script>

/* 1. INICJALIZACJA MAPY */
var map = L.map('map', { 
    minZoom: 12, 
    maxZoom: 24 
}).setView([51.33769, 19.36409], 18); 

/* 2. DEFINICJE WARSTW KAFELKOWYCH (Z SYSTEMOWYM WYCISZANIEM BŁĘDÓW 404) */
var opcjeWarstwy = {
    maxZoom: 24,
    maxNativeZoom: 20,
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
};

var orto = L.tileLayer('./podklady/orto/{z}/{x}/{y}.jpg', opcjeWarstwy);
var rosliny = L.tileLayer('./podklady/rosliny/{z}/{x}/{y}.jpg', opcjeWarstwy);
var cienie = L.tileLayer('./podklady/cienie/{z}/{x}/{y}.jpg', opcjeWarstwy);
var ukszt = L.tileLayer('./podklady/uksztaltowanie/{z}/{x}/{y}.jpg', opcjeWarstwy);

// Włączamy ortofotomapę jako domyślny podkład startowy
orto.addTo(map);

/* 3. WARSTWA WEKTOROWA DZIAŁEK */
var dzialkiLayer = L.geoJSON(null, {
    style: { color: "#ff0000", weight: 2, fillOpacity: 0.1 },
    onEachFeature: function (feature, layer) {

        layer.on("mouseover", function() {
            layer.setStyle({ color: "#ffffff", weight: 3, fillOpacity: 0 });
        });
        layer.on("mouseout", function() {
            layer.setStyle({ color: "#ff0000", weight: 2, fillOpacity: 0.1 });
        });

        layer.on("click", function() {
            var p = feature.properties;
            var html = `
                <div class="popup-title">Informacje o działce ${p.numer || p.id || ""}</div>
                <div class="popup-line"><b>ID:</b> ${p.id || ""}</div>
                <div class="popup-line"><b>Gmina:</b> ${p.gmina || ""}</div>
                <div class="popup-line"><b>Obręb:</b> ${p.obreb || ""}</div>
                <div class="popup-line"><b>Powierzchnia:</b> ${p.powierzchnia || ""} m²</div>
                <div class="popup-line"><b>Klasoużytki:</b> ${p.klasouzytki || ""}</div>
                <div class="popup-line"><b>Data zdjęcia:</b> ${p.data || ""}</div>
            `;
            layer.bindPopup(html).openPopup();
        });
    }
});

// Włączenie działek na start
dzialkiLayer.addTo(map);

// Bezpieczne, asynchroniczne pobieranie pliku GeoJSON
fetch('./dzialki/dzialki.geojson')
    .then(function(response) {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
    })
    .then(function(data) {
        dzialkiLayer.addData(data);
    })
    .catch(function(error) {
        console.error("Błąd GeoJSON:", error);
    });

/* 4. PANEL WARSTW I INTERFEJS UI */
var baseMaps = {
    "Ortofotomapa": orto,
    "Stan roślin (VARI)": rosliny,
    "Cienie": cienie,
    "Ukształtowanie terenu": ukszt
};

var overlays = {
    "Działki": dzialkiLayer
};

// Dodajemy panel warstw wprost do dedykowanego kontenera w menu bocznym
var layerControl = L.control.layers(baseMaps, overlays, { collapsed: false });
layerControl.addTo(map);

// Przenoszenie wygenerowanego panelu do Twojego kontenera na stronie
var panelDOM = layerControl.getContainer();
document.getElementById("layerContainer").appendChild(panelDOM);

/* SUWAK PRZEZROCZYSTOŚCI */
document.getElementById("opacitySlider").addEventListener("input", function(e) {
    var v = e.target.value;
    orto.setOpacity(v);
    rosliny.setOpacity(v);
    cienie.setOpacity(v);
    ukszt.setOpacity(v);
});

/* TRYB NOCNY */
document.getElementById("darkSwitch").addEventListener("change", function(e) {
    if (e.target.checked) {
        document.body.classList.add("dark-mode");
    } else {
        document.body.classList.remove("dark-mode");
    }
});

</script>
</body>
</html>
