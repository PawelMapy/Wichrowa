<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Mapa Kitkacy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map { width:100%; height:100%; }

/* UI ELEMENTS */
.ui-box {
    background: #ffffff;
    padding: 10px;
    border-radius: 6px;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
    z-index: 1000;
    font-family: sans-serif;
}

/* DARK MODE */
.dark-mode .ui-box {
    background: #222;
    color: #eee;
    border: 1px solid #555;
}

.dark-mode #map {
    filter: none !important;
}

/* POPUP STYLE */
.leaflet-popup-content-wrapper {
    border: 1px solid #cccccc;
    border-radius: 6px;
    padding: 0;
}
.leaflet-popup-content {
    margin: 0;
    padding: 10px 14px;
    font-family: sans-serif;
}
.popup-title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 8px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
}
.popup-line {
    margin: 3px 0;
}

/* LEGEND DEM */
#legendDEM {
    position: absolute;
    bottom: 20px;
    right: 10px;
    width: 140px;
}
.legend-step {
    height: 20px;
    margin-bottom: 4px;
    border: 1px solid #999;
    font-size: 12px;
    padding-left: 4px;
    color: #000;
}

/* UI POSITIONS — RIGHT SIDE */
#darkToggle {
    position: absolute;
    top: 10px;
    right: 10px;
}

#layerControl {
    position: absolute;
    top: 70px;
    right: 10px;
    width: 220px;
}

#opacityControl {
    position: absolute;
    top: 260px;
    right: 10px;
    width: 220px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="darkToggle" class="ui-box">
    <label><input type="checkbox" id="darkSwitch"> Tryb nocny</label>
</div>

<div id="layerControl" class="ui-box">
    <div id="layerContainer"></div>
</div>

<div id="opacityControl" class="ui-box">
    <label>Przezroczystość warstw:</label><br>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
</div>

<div id="legendDEM" class="ui-box">
    <b>Wysokość (m)</b><br><br>

    <div class="legend-step" style="background:#f7f08a">142.7</div>
    <div class="legend-step" style="background:#e5dd5c">138</div>
    <div class="legend-step" style="background:#c7bb51">134</div>
    <div class="legend-step" style="background:#a89a47">130</div>
    <div class="legend-step" style="background:#8a7a3d">126</div>
    <div class="legend-step" style="background:#6a5b33">122</div>
    <div class="legend-step" style="background:#4a3f2a">118</div>
    <div class="legend-step" style="background:#2e2a1f">116.7</div>
</div>

<script>

/* 1. ZASIĘGI I INICJALIZACJA MAPY */
var bounds = [
    [51.3350, 19.3600],
    [51.3395, 19.3700]
];

var kafelkiBounds = [
    [51.3300, 19.3500], 
    [51.3450, 19.3800]  
];

/* 1. INICJALIZACJA MAPY (Wyrzucamy ograniczenia bounds) */
var map = L.map('map', { 
    minZoom: 12, 
    maxZoom: 24 
}).setView([51.3375, 19.3642], 18); // Idealnie wymierzony środek Twojej działki

/* 2. DEFINICJE WARSTW KAFELKOWYCH (Z SYSTEMOWYM WYGASZANIEM BŁĘDÓW 404) */
var opcjeWarstwy = {
    maxZoom: 24,
    maxNativeZoom: 20,
    // Ta kluczowa linijka wycisza błędy 404 w konsoli dla brakujących kafelków z tła:
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
};

var orto = L.tileLayer('./podklady/orto/{z}/{x}/{y}.jpg', opcjeWarstwy);
var rosliny = L.tileLayer('./podklady/rosliny/{z}/{x}/{y}.jpg', opcjeWarstwy);
var cienie = L.tileLayer('./podklady/cienie/{z}/{x}/{y}.jpg', opcjeWarstwy);
var ukszt = L.tileLayer('./podklady/uksztaltowanie/{z}/{x}/{y}.jpg', opcjeWarstwy);

// Włączamy ortofotomapę jako domyślny podkład startowy
orto.addTo(map);

/* 3. WARSTWA WEKTOROWA DZIAŁEK */
var dzialkiLayer = L.geoJSON(null, {
    style: { color: "#ff0000", weight: 2, fillOpacity: 0.1 },
    onEachFeature: function (feature, layer) {

        layer.on("mouseover", function() {
            layer.setStyle({ color: "#ffffff", weight: 3, fillOpacity: 0 });
        });
        layer.on("mouseout", function() {
            layer.setStyle({ color: "#ff0000", weight: 2, fillOpacity: 0.1 });
        });

        layer.on("click", function() {
            var p = feature.properties;
            var html = `
                <div class="popup-title">Informacje o działce ${p.numer || p.id || ""}</div>
                <div class="popup-line"><b>ID:</b> ${p.id || ""}</div>
                <div class="popup-line"><b>Gmina:</b> ${p.gmina || ""}</div>
                <div class="popup-line"><b>Obręb:</b> ${p.obreb || ""}</div>
                <div class="popup-line"><b>Powierzchnia:</b> ${p.powierzchnia || ""} m²</div>
                <div class="popup-line"><b>Klasoużytki:</b> ${p.klasouzytki || ""}</div>
                <div class="popup-line"><b>Data zdjęcia:</b> ${p.data || ""}</div>
            `;
            layer.bindPopup(html).openPopup();
        });
    }
});

// Pobieranie pliku GeoJSON - bez ukrytych komend centrujących od Copilota
fetch('./dzialki/dzialki.geojson')
    .then(r => r.json())
    .then(j => {
        dzialkiLayer.addData(j);
        // Automatycznie włączamy działki na start, żeby były od razu widoczne
        dzialkiLayer.addTo(map); 
    })
    .catch(err => console.error("Błąd ładowania GeoJSON:", err));

/* 4. PANEL WARSTW I INTERFEJS UI */
var overlays = {
    "Ortofotomapa": orto,
    "Stan roślin (VARI)": rosliny,
    "Cienie": cienie,
    "Ukształtowanie terenu": ukszt,
    "Działki": dzialkiLayer
};

var layerControl = L.control.layers(null, overlays, { collapsed: false });
layerControl.addTo(map);

/* PRZENIESIENIE PANELU WARSTW DO TWOJEGO KONTENERA */
setTimeout(() => {
    const lc = document.querySelector(".leaflet-control-layers");
    if (lc) {
        document.getElementById("layerContainer").appendChild(lc);
    }
}, 300);

/* SUWAK PRZEZROCZYSTOŚCI */
document.getElementById("opacitySlider").addEventListener("input", function(e) {
    var v = e.target.value;
    orto.setOpacity(v);
    rosliny.setOpacity(v);
    cienie.setOpacity(v);
    ukszt.setOpacity(v);
});

/* TRYB NOCNY */
document.getElementById("darkSwitch").addEventListener("change", function(e) {
    if (e.target.checked) {
        document.body.classList.add("dark-mode");
    } else {
        document.body.classList.remove("dark-mode");
    }
});

map.on("click", function(e) {});

</script>
</body>
</html>
